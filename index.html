<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnglerBot Status</title>
<style>
  html { background: #000; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1.4;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: bold; margin: 0 0 4px; }
  h2 { font-size: 20px; font-weight: bold; margin: 32px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #fff; }
  p { margin: 6px 0; }
  table { border-collapse: collapse; }
  td, th { padding: 1px 24px 1px 0; text-align: left; font-weight: normal; vertical-align: baseline; }
  td.num { text-align: right; padding-right: 0; min-width: 5ch; }
  .cols { display: flex; flex-wrap: wrap; gap: 8px 64px; align-items: flex-start; }
  .cols td.num { padding: 1px 6px; min-width: 7ch; }
  .cols td.hi { background: #fff; color: #000; }
  th { font-weight: bold; padding-bottom: 4px; }
  .on { background: #fff; color: #000; padding: 0 6px; }
  .note { font-style: italic; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; gap: 24px; padding: 2px 0; }
  footer { margin-top: 40px; font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>AnglerBot Status</h1>
  <p>Rosbridge: <span id="conn">Connecting...</span> (<span id="url"></span>)</p>

  <h2>Metal Detector</h2>
  <p><span id="metal">No Data</span> <span id="metal-detail"></span></p>

  <h2>Pulse Widths Sent to Arduino (us)</h2>
  <table>
    <tr><td>Front Left Steer</td><td id="cmd0" class="num">-</td></tr>
    <tr><td>Front Right Steer</td><td id="cmd1" class="num">-</td></tr>
    <tr><td>Rear Left Drive</td><td id="cmd2" class="num">-</td></tr>
    <tr><td>Rear Right Drive</td><td id="cmd3" class="num">-</td></tr>
  </table>
  <p id="cmd-note" class="note"></p>

  <h2>Xbox Controller</h2>
  <p>Status: <span id="joy-status">No Data</span></p>
  <div class="cols">
    <table>
      <thead><tr><th colspan="2">Buttons</th></tr></thead>
      <tbody id="joy-buttons"></tbody>
    </table>
    <table>
      <thead><tr><th colspan="2">Analog</th></tr></thead>
      <tbody id="joy-analog"></tbody>
    </table>
  </div>

  <h2>Event Log</h2>
  <ul id="log"></ul>
  <p id="log-empty" class="note">No events yet.</p>

  <footer id="footer"></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
<script>
  // rosbridge location
  // index.html?host=192.168.1.50&port=9090
  const params = new URLSearchParams(window.location.search);
  const HOST = params.get('host') || window.location.hostname || 'localhost';
  const PORT = params.get('port') || '9090';
  const WS_URL = 'ws://' + HOST + ':' + PORT;

  const TOPICS = {
    metal: params.get('metal') || '/metal_detected',
    cmds: params.get('cmds') || '/car_hardware/commands_us',
    joy: params.get('joy') || '/joy',
  };
  const STALE_MS = 2000; // no message for this long, treat the feed as gone

  const $ = (id) => document.getElementById(id);
  const el = {
    conn: $('conn'), url: $('url'),
    metal: $('metal'), metalDetail: $('metal-detail'),
    cmd: [$('cmd0'), $('cmd1'), $('cmd2'), $('cmd3')], cmdNote: $('cmd-note'),
    joyStatus: $('joy-status'), joyButtons: $('joy-buttons'), joyAnalog: $('joy-analog'),
    log: $('log'), logEmpty: $('log-empty'), footer: $('footer'),
  };
  el.url.textContent = WS_URL;
  el.footer.textContent = TOPICS.metal + '   ' + TOPICS.cmds + '   ' + TOPICS.joy;

  let connected = false;
  const seen = { metal: 0, cmds: 0, joy: 0 }; // time of last message per topic
  let lastValue = null;
  let lastChange = null;
  let joyPresent = false;

  const fmtTime = (d) => d.toLocaleTimeString();

  const LOG_MAX = 50; // maximum number of log entries before removing some

  function addLogEntry(text) {
    el.logEmpty.style.display = 'none';
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.textContent = text;
    const b = document.createElement('span');
    b.textContent = fmtTime(new Date());
    li.append(a, b);
    el.log.prepend(li);
    while (el.log.children.length > LOG_MAX) el.log.lastChild.remove();
  }

  // metal detector
  function setMetal(text, detail, highlight) {
    el.metal.textContent = text;
    el.metal.classList.toggle('on', !!highlight);
    el.metalDetail.textContent = detail || '';
  }

  function onMetal(msg) {
    seen.metal = Date.now();
    const detected = !!msg.data;
    if (detected !== lastValue) {
      const first = lastValue === null;
      lastValue = detected;
      lastChange = new Date();
      addLogEntry(detected ? '[METAL DETECTOR] Metal Detected!' : '[METAL DETECTOR] All clear.');
    }
    if (detected) setMetal('METAL DETECTED');
    else setMetal('No metal detected', 'since ' + fmtTime(lastChange), false);
  }

  // pulse widths to arduino
  function onCmds(msg) {
    seen.cmds = Date.now();
    const d = msg.data || [];
    el.cmd.forEach((cell, i) => {
      cell.textContent = typeof d[i] === 'number' ? String(d[i]) : '\u2014';
    });
    el.cmdNote.textContent = '';
  }

  function clearCmds(note) {
    el.cmd.forEach((cell) => { cell.textContent = '\u2014'; });
    el.cmdNote.textContent = note || '';
  }

  // controller
  const BUTTON_NAMES = {
    0: 'A', 
    1: 'B', 
    3: 'X', 
    4: 'Y',
    6: 'LB', 
    7: 'RB',
    10: 'View', 
    11: 'Menu', 
    12: 'Xbox',
    13: 'LSB', 
    14: 'RSB', 
    15: 'Share',
  };
  const AXIS_NAMES = {
    0: 'LS (X)', 
    1: 'LS (Y)',
    2: 'RS (X)', 
    3: 'RS (Y)',
    4: 'RT', 
    5: 'LT',
  };
 
  const DPAD_X_AXIS = 6; // +1 = left, -1 = right
  const DPAD_Y_AXIS = 7; // +1 = up, -1 = down

  function fmtAnalog(v) {
    if (typeof v !== 'number') return '\u2014';
    if (Math.abs(v) < 0.0003) v = 0;   // clean input
    return v.toFixed(3);
  }

  function controlRows(msg) {
    const axes = msg.axes || [];
    const buttons = (msg.buttons || []).map((v, i) => ({
      name: BUTTON_NAMES[i] || ' ',
      text: BUTTON_NAMES[i] ? (v ? '1' : '0') : " ",
      hi: !!v,
    }));
    const dx = axes[DPAD_X_AXIS];
    const dy = axes[DPAD_Y_AXIS];
    if (typeof dx === 'number' && typeof dy === 'number') {
      [
        ['D-pad up', dy > 0.5],
        ['D-pad down', dy < -0.5],
        ['D-pad left', dx > 0.5],
        ['D-pad right', dx < -0.5],
      ].forEach(([name, on]) => buttons.push({ name: name, text: on ? '1' : '0', hi: on }));
    }
    const analog = [];
    axes.forEach((v, i) => {
      if (i === DPAD_X_AXIS || i === DPAD_Y_AXIS) return;
      analog.push({ name: AXIS_NAMES[i] || 'axis ' + i, text: fmtAnalog(v), hi: false });
    });
    return { buttons: buttons, analog: analog };
  }

  function renderRows(tbody, rows) {
    const key = rows.map((r) => r.name).join('|');
    if (tbody.dataset.key !== key) {
      tbody.textContent = '';
      rows.forEach((r) => {
        const tr = document.createElement('tr');
        const name = document.createElement('td');
        name.textContent = r.name;
        const val = document.createElement('td');
        val.className = 'num';
        tr.append(name, val);
        tbody.append(tr);
      });
      tbody.dataset.key = key;
    }
    rows.forEach((r, i) => {
      const cell = tbody.children[i].lastChild;
      cell.textContent = r.text;
      cell.classList.toggle('hi', r.hi);
    });
  }

  function clearJoy(status) {
    el.joyButtons.textContent = '';
    el.joyAnalog.textContent = '';
    el.joyButtons.dataset.key = '';
    el.joyAnalog.dataset.key = '';
    el.joyStatus.textContent = status;
  }

  function setJoyPresent(present) {
    if (present === joyPresent) return;
    joyPresent = present;
    addLogEntry(present ? '[CONTROLLER] Controller connected!' : '[CONTROLLER] Controller lost :(');
    if (present) el.joyStatus.textContent = 'Connected!';
    else clearJoy('no data (is the controller on, and is joy_node running?)');
  }

  function onJoy(msg) {
    seen.joy = Date.now();
    setJoyPresent(true);
    const rows = controlRows(msg);
    renderRows(el.joyButtons, rows.buttons);
    renderRows(el.joyAnalog, rows.analog);
  }

  // connection
  function resetAll() {
    seen.metal = seen.cmds = seen.joy = 0;
    lastValue = null;
    joyPresent = false;
    setMetal('Not Connected', '', false);
    clearCmds('');
    clearJoy('Not Connected');
  }

  function setConnected(up) {
    connected = up;
    el.conn.textContent = up ? 'connected' : 'disconnected';
    if (up) {
      setMetal('no data', 'Waiting on ' + TOPICS.metal + '...', false);
      clearCmds('Waiting on ' + TOPICS.cmds + '...');
      clearJoy('Waiting on ' + TOPICS.joy + '...');
    } else {
      resetAll();
    }
  }

  // topics that have gone quiet
  setInterval(() => {
    if (!connected) return;
    const now = Date.now();
    const fresh = (t) => t > 0 && now - t < STALE_MS;

    if (!fresh(seen.metal) && seen.metal > 0) {
      lastValue = null;
      setMetal('no data', 'nothing on ' + TOPICS.metal + ' (check metal_detector_node)', false);
    }
    if (!fresh(seen.cmds) && seen.cmds > 0) {
      clearCmds('nothing on ' + TOPICS.cmds + ' (check controller_manager)');
    }
    if (!fresh(seen.joy)) {
      if (joyPresent) setJoyPresent(false);
      else if (seen.joy > 0) clearJoy('no data (check if controller is on)');
    }
  }, 500);

  // rosbridge
  function subscribe(ros, name, messageType, callback, throttleMs) {
    const opts = { ros: ros, name: name, messageType: messageType };
    if (throttleMs) opts.throttle_rate = throttleMs;
    new ROSLIB.Topic(opts).subscribe(callback);
  }

  function connect() {
    const ros = new ROSLIB.Ros({ url: WS_URL });
    ros.on('connection', () => {
      setConnected(true);
      subscribe(ros, TOPICS.metal, 'std_msgs/msg/Bool', onMetal);
      subscribe(ros, TOPICS.cmds, 'std_msgs/msg/Int32MultiArray', onCmds, 100);
      subscribe(ros, TOPICS.joy, 'sensor_msgs/msg/Joy', onJoy, 50);
    });
    ros.on('error', () => { /* 'close' follows; handled there */ });
    ros.on('close', () => {
      setConnected(false);
      setTimeout(connect, 2000);
    });
  }

  if (typeof ROSLIB === 'undefined') {
    el.conn.textContent = 'error: could not load roslib.min.js from the CDN';
  } else {
    resetAll();
    connect();
  }
</script>
</body>
</html>
